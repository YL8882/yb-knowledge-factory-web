<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YB Knowledge Factory</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>YB Knowledge Factory</h1>
            <p class="subtitle">YouTube 逐字稿 & 學習筆記產生器</p>
        </header>

        <main>
            <div class="input-section">
                <label for="youtube-url">YouTube 網址</label>
                <input
                    type="text"
                    id="youtube-url"
                    placeholder="貼上 YouTube 網址，例如: https://www.youtube.com/watch?v=..."
                    aria-label="YouTube URL input"
                >
            </div>

            <button id="generate-btn" class="btn-primary">Generate</button>

            <div id="status" class="status-hidden"></div>

            <section class="queue-section">
                <h2>Learning Queue</h2>
                <ul id="queue-list" class="queue-list"></ul>
                <p id="queue-empty" class="queue-empty">尚無項目</p>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 YB Knowledge Factory. All rights reserved.</p>
        </footer>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
